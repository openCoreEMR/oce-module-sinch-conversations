# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Prefix policy (so release-please only cuts releases for runtime changes):
#   - Runtime deps  -> "fix(deps)"        => release-please bumps patch
#   - Dev deps      -> "chore(deps-dev)"  => no version bump (still in changelog)
#   - GitHub Actions / reusable workflows -> "chore(ci)" => no version bump

version: 2
updates:
  # Monitor Composer dependencies
- package-ecosystem: composer
  cooldown:
    exclude:
    - openCoreEMR/*
    - opencoreemr/*
  directory: /
  schedule:
    interval: daily
  labels:
  - dependencies
  - composer
  commit-message:
    prefix: fix(deps)
    prefix-development: chore(deps-dev)
  groups:
    # Collapse routine minor/patch bumps into a single PR each so a batch of
    # Symfony/Twig/etc. releases no longer opens five separate PRs. Major bumps
    # stay ungrouped (individual PRs) since they warrant per-package review.
    production:
      dependency-type: production
      update-types:
      - minor
      - patch
    development:
      dependency-type: development
      update-types:
      - minor
      - patch
  ignore:
  # OpenEMR pins symfony/* at ^7.3; ignore Symfony 8 until upstream moves.
  - dependency-name: symfony/*
    versions:
    - '>=8.0'
  # OpenEMR requires guzzlehttp/guzzle ^7.10; ignore Guzzle 8 until upstream moves.
  - dependency-name: guzzlehttp/guzzle
    versions:
    - '>=8.0'

# Monitor GitHub Actions
- package-ecosystem: github-actions
  cooldown:
    exclude:
    - openCoreEMR/*
    - opencoreemr/*
  directory: /
  schedule:
    interval: daily
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: chore(ci)
  groups:
    github-workflows-public:
      patterns:
      - openCoreEMR/github-workflows-public/*
    github-workflows-internal:
      patterns:
      - openCoreEMR/github-workflows-internal/*
