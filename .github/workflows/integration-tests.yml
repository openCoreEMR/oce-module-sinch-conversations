name: Integration Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  integration:
    name: End-to-end integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: none

    - name: Install Task
      uses: arduino/setup-task@v3
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Locate Composer download cache
      id: composer-cache
      env:
        lock_hash: ${{ hashFiles('composer.lock', 'tools/openemr/composer.json') }}
      run: |
        dir=$(composer config --global cache-files-dir)
        mkdir -p "$dir"
        {
          echo "dir=$dir"
          echo "prefix=${RUNNER_OS}-composer-files-${lock_hash}-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Composer downloads
      # The installs below fetch ~250 dist archives from codeload.github.com,
      # enough to trip GitHub's secondary rate limit (HTTP 429) on a cold runner.
      # Only the files cache is kept; the VCS cache would hold a full openemr clone.
      # Restore and save are split because actions/cache saves only on success:
      # each run that downloads anything saves under its own key, even if an
      # install fails, so a rerun after a 429 starts from what was already fetched.
      id: composer-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ steps.composer-cache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.composer-cache.outputs.prefix }}
          ${{ runner.os }}-composer-files-

    - name: Inventory restored Composer downloads
      id: composer-cache-before
      env:
        dir: ${{ steps.composer-cache.outputs.dir }}
      run: echo "inventory=$(find "$dir" -type f -printf '%P\n' | LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Install module composer deps
      run: composer install --no-progress --no-interaction --prefer-dist

    - name: Install OpenEMR source under tools/openemr
      run: composer install --working-dir=tools/openemr --no-progress --no-interaction --prefer-dist

    - name: Install OpenEMR's own runtime dependencies
      # The openemr/openemr:flex image bind-mounts tools/openemr/vendor/openemr/openemr
      # over /var/www/.../openemr. Without this step the bind mount has no vendor/
      # of its own, login.php fails on the require_once(autoload.php) and the
      # health check never goes green.
      run: composer install --working-dir=tools/openemr/vendor/openemr/openemr --no-dev --no-progress --no-interaction --prefer-dist

    - name: Inventory Composer downloads
      id: composer-cache-after
      if: ${{ !cancelled() }}
      env:
        dir: ${{ steps.composer-cache.outputs.dir }}
      run: echo "inventory=$(find "$dir" -type f -printf '%P\n' | LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Save Composer downloads
      if: ${{ !cancelled() && steps.composer-cache-after.outputs.inventory != steps.composer-cache-before.outputs.inventory }}
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ steps.composer-cache-restore.outputs.cache-primary-key }}

    - name: Bring up dev stack
      run: docker compose up -d --wait --wait-timeout 600
      env:
        COMPOSE_HTTP_TIMEOUT: '300'

    - name: Wait for OpenEMR install to settle
      run: |
        ready=false
        for _ in {1..60}; do
          if docker compose exec -T openemr grep -qF "config = 1" /var/www/localhost/htdocs/openemr/sites/default/sqlconf.php; then
            ready=true
            break
          fi
          sleep 5
        done
        if [ "$ready" != "true" ]; then
          echo "::error::OpenEMR did not finish installing within 5 minutes"
          docker compose logs openemr
          exit 1
        fi

    - name: Register and enable module
      run: task module:install-enable

    - name: Run integration suite
      run: task test:integration

    - name: Dump openemr logs on failure
      if: failure()
      run: docker compose logs openemr
